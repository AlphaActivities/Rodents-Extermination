name: iPhone Safari canvas
on:
  push:
    branches: [preview/ios-safari-canvas]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4173
          VITE_SUPABASE_ANON_KEY: offline-review-only
      - run: command -v xcodegen || brew install xcodegen
      - name: Inspect the dashboard in Safari on the iOS simulator
        run: python3 scripts/qa/ios-safari.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-safari-screenshots
          path: ios-results/
